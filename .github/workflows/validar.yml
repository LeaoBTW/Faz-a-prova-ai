name: Validar banco de questões

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar esquema, ids e gabaritos
        run: python3 tools/validar_banco.py
      - name: Conferir comentários revisados
        run: python3 tools/comentarios/montar.py --conferir
      - name: Conferir questões do Técnico Bancário
        run: python3 tools/tecnico_bancario.py --conferir
      - name: Conferir questões criadas para o Técnico Bancário
        run: python3 tools/tecnico/gerar.py --conferir
